version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # MkDocs plugins in requirements.txt (mkdocs-material itself follows the Docker base tag).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
