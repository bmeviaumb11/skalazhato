{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    // Material renders Mermaid diagrams into closed shadow roots. Force them
    // open so mermaid-lightbox.js can copy the rendered SVG into its overlay.
    (function () {
      var attach = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function (init) {
        if (this.classList && this.classList.contains("mermaid")) {
          init = Object.assign({}, init, { mode: "open" });
        }
        return attach.call(this, init);
      };
    })();
  </script>
{% endblock %}
